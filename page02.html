            width: 60px;

            border-radius: 4px;

            accent-color: #ff0000;

    <!-- Selector de Color -->
    <div class="card">
        <div class="color-display" id="color-box"></div>
        <div class="controls">
            <div class="slider-container-2">
                <div class="slider-row">
                    <label for="red-slider">R</label>
                    <input type="range" id="red-slider" min="0" max="255" value="127">
                    <input type="number" id="red-value" min="0" max="255" value="127">
                </div>
                
                <div class="slider-row">
                    <label for="green-slider">G</label>
                    <input type="range" id="green-slider" min="0" max="255" value="127">
                    <input type="number" id="green-value" min="0" max="255" value="127">
                </div>
                
                <div class="slider-row">
                    <label for="blue-slider">B</label>
                    <input type="range" id="blue-slider" min="0" max="255" value="127">
                    <input type="number" id="blue-value" min="0" max="255" value="127">
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get all elements for color selector
        const colorBox = document.getElementById('color-box');
        
        const redSlider = document.getElementById('red-slider');
        const greenSlider = document.getElementById('green-slider');
        const blueSlider = document.getElementById('blue-slider');
        
        const redValue = document.getElementById('red-value');
        const greenValue = document.getElementById('green-value');
        const blueValue = document.getElementById('blue-value');
        
        // Function to update color display
        function updateColor() {
            const r = redSlider.value;
            const g = greenSlider.value;
            const b = blueSlider.value;
            
            colorBox.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        }
        
        // Set up event listeners for sliders
        redSlider.addEventListener('input', function() {
            redValue.value = this.value;
            updateColor();
        });
        
        greenSlider.addEventListener('input', function() {
            greenValue.value = this.value;
            updateColor();
        });
        
        blueSlider.addEventListener('input', function() {
            blueValue.value = this.value;
            updateColor();
        });
        
        // Set up event listeners for number inputs
        redValue.addEventListener('input', function() {
            if (this.value > 255) this.value = 255;
            if (this.value < 0) this.value = 0;
            redSlider.value = this.value;
            updateColor();
        });
        
        greenValue.addEventListener('input', function() {
            if (this.value > 255) this.value = 255;
            if (this.value < 0) this.value = 0;
            greenSlider.value = this.value;
            updateColor();
        });
        
        blueValue.addEventListener('input', function() {
            if (this.value > 255) this.value = 255;
            if (this.value < 0) this.value = 0;
            blueSlider.value = this.value;
            updateColor();
        });
        
        // Initialize color
        updateColor();
    </script>
